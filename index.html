<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STAR CATCHER</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #090e1d;
      color: #fff;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .game-wrap { width: min(800px, 100%); }
    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 0 12px;
    }
    h1 {
      margin: 0;
      color: #ffdc66;
      font-size: clamp(22px, 4vw, 32px);
      letter-spacing: 3px;
    }
    .help { color: #aab6d0; font-size: 13px; text-align: right; }
    #game { width: 100%; overflow: hidden; border: 1px solid #293858; border-radius: 12px; }
    canvas { display: block; width: 100% !important; height: auto !important; }
    .caption {
      margin-top: 12px;
      color: #aab6d0;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <div class="heading">
      <h1>STAR CATCHER</h1>
      <div class="help">마우스를 좌우로 움직여 원을 조종하세요</div>
    </div>
    <div id="game"></div>
    <div class="caption">△ 별을 모으면 +10점 · □ 운석에 닿으면 생명 -1 · 스페이스바 또는 클릭으로 시작/재시작</div>
  </main>

  <script>
    const W = 800;
    const H = 600;

    let items = [];
    let playerX = W / 2;
    const playerY = H - 60;
    const playerSize = 35;

    let score = 0;
    let lives = 3;
    let started = false;
    let gameOver = false;
    let difficulty = 1;
    let gameFrame = 0;

    function setup() {
      const canvas = createCanvas(W, H);
      canvas.parent("game");
      textFont("Arial");
      textAlign(CENTER, CENTER);
      noStroke();
    }

    function draw() {
      background(15, 20, 40);
      drawBackground();

      if (!started && !gameOver) {
        playerX = constrain(mouseX, playerSize / 2, W - playerSize / 2);
        drawPlayer();
        drawTitle();
        return;
      }

      if (gameOver) {
        drawPlayer();
        drawGameOver();
        return;
      }

      playerX = constrain(mouseX, playerSize / 2, W - playerSize / 2);
      difficulty = min(3.0, 1 + score / 100.0);
      gameFrame++;

      const spawnRate = max(18, 48 - floor(score / 15));
      if (gameFrame % spawnRate === 0) {
        items.push(new Drop());
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const d = items[i];
        d.update();
        d.display();

        if (d.isColliding(playerX, playerY)) {
          if (d.isStar) {
            score += 10;
          } else {
            lives--;
          }

          items.splice(i, 1);

          if (lives <= 0) {
            gameOver = true;
          }
          continue;
        }

        if (d.y > H + 30) {
          items.splice(i, 1);
        }
      }

      drawPlayer();
      drawUI();
    }

    function drawBackground() {
      for (let i = 0; i < 60; i++) {
        const x = (i * 137) % W;
        const y = (i * 83) % H;
        fill(255, 150);
        circle(x, y, 2);
      }
    }

    function drawPlayer() {
      fill(70, 180, 255);
      circle(playerX, playerY, playerSize);
    }

    function drawUI() {
      fill(255);
      textSize(22);
      textAlign(LEFT, CENTER);
      text("SCORE: " + score, 25, 35);
      textAlign(RIGHT, CENTER);
      text("LIVES: " + lives, W - 25, 35);
    }

    function drawTitle() {
      textAlign(CENTER, CENTER);
      fill(255, 220, 80);
      textSize(55);
      text("STAR CATCHER", W / 2, H / 2 - 70);

      fill(255);
      textSize(20);
      text("Catch stars and avoid meteors!", W / 2, H / 2);
      textSize(17);
      text("Move your mouse to control the circle", W / 2, H / 2 + 45);
      text("Press SPACE or click to start", W / 2, H / 2 + 90);
    }

    function drawGameOver() {
      fill(255, 100, 110);
      textAlign(CENTER, CENTER);
      textSize(50);
      text("GAME OVER", W / 2, H / 2 - 50);

      fill(255);
      textSize(25);
      text("Final Score: " + score, W / 2, H / 2 + 10);
      textSize(17);
      text("Press SPACE or click to restart", W / 2, H / 2 + 65);
    }

    function keyPressed() {
      if (key === " ") {
        startOrRestart();
        return false;
      }
    }

    function mousePressed() {
      startOrRestart();
      return false;
    }

    function startOrRestart() {
      if (!started && !gameOver) {
        started = true;
      } else if (gameOver) {
        resetGame();
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      difficulty = 1;
      items = [];
      gameFrame = 0;
      playerX = W / 2;
      started = true;
      gameOver = false;
    }

    class Drop {
      constructor() {
        this.x = random(30, W - 30);
        this.y = -20;
        this.isStar = random(1) < 0.7;
        this.size = this.isStar ? 24 : 28;
        this.speed = random(2, 4);
      }

      update() {
        this.y += this.speed * difficulty;
      }

      display() {
        if (this.isStar) {
          fill(255, 220, 70);
          triangle(
            this.x, this.y - this.size / 2,
            this.x - this.size / 2, this.y + this.size / 2,
            this.x + this.size / 2, this.y + this.size / 2
          );
        } else {
          fill(150, 160, 175);
          rectMode(CENTER);
          rect(this.x, this.y, this.size, this.size);
          rectMode(CORNER);
        }
      }

      isColliding(px, py) {
        return dist(this.x, this.y, px, py) < (this.size / 2 + playerSize / 2);
      }
    }
  </script>
</body>
</html>
